trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:

# ==========================================================
# STAGE 1 - TERRAFORM PLAN
# ==========================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:

  - job: Plan
    displayName: 'Terraform Init Validate Plan'

    steps:

    - checkout: self

    # Install exact Terraform version
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.15.9'

    # Terraform Init
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'kk_spn_aks'
        backendAzureRmStorageAccountName: 'sabackendkkdev01'
        backendAzureRmContainerName: 'backend'
        backendAzureRmKey: 'aks-lab.tfstate'
        commandOptions: '-lockfile=readonly'

    # Terraform Validate
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'

    # Terraform Plan
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'kk_spn_aks'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    # Publish exact plan
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'


# ==========================================================
# STAGE 2 - TERRAFORM APPLY
# ==========================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:

  - deployment: Apply
    displayName: 'Terraform Apply'

    environment: 'terraform-production'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          # Install SAME Terraform version
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.15.9'

          # Download exact plan generated by Plan stage
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          # Terraform Init using SAME lock file
          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'kk_spn_aks'
              backendAzureRmStorageAccountName: 'sabackendkkdev01'
              backendAzureRmContainerName: 'backend'
              backendAzureRmKey: 'aks-lab.tfstate'
              commandOptions: '-lockfile=readonly'

          # Apply EXACT saved plan
          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'kk_spn_aks'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'